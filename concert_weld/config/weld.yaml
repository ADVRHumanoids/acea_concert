solver:
  type: ipopt
  # ipopt.linear_solver: ma57
  ipopt.tol: 0.1
#  ilqr.tol: 0.01
  ipopt.constr_viol_tol: 0.01
#  ilqr.constr_viol_tol: 0.01
#  ipopt.hessian_approximation: exact
  ipopt.print_level: 5
  # ipopt.suppress_all_output: 'yes'
  # ipopt.sb: 'yes'
#  ilqr.suppress_all_output: 'yes'
#  ilqr.codegen_enabled: true
#  ilqr.codegen_workdir: /tmp/soafwg
#  ilqr.enable_gn: true
#  ilqr.hxx_reg_base: 0.0
#  ilqr.n_threads: 0
#  print_time: 0

constraints:
  - ee_pos
  - ee_ori
  - joint_limits

costs:

  - posture_arm
  - posture_base
  - velocity_regularization
  - acceleration_regularization



.define:

    - &w_pos 1.0
    - &w_ori 1.0
    - &w_vel 0.3
    - &w_acc 1e-2
    - &w_postural_arm 0.1
    - &w_postural_base 0.

ee_pos:
  type: Cartesian
  distal_link: ee_F
  indices: [0, 1, 2]
  nodes: all
  weight: *w_pos

ee_ori:
  type: Cartesian
  distal_link: ee_F
  indices: [3, 4, 5]
  nodes: all
  weight: *w_ori

posture_base:
  type: Cartesian
  distal_link: base_link
  nodes: all
  indices: [0, 1, 2, 3, 4, 5]
  cartesian_type: velocity
  weight: *w_postural_base

posture_arm:
  type: Postural
  weight: *w_postural_arm
  indices: [J1_E, J2_E, J1_F, J2_F, J3_F] # wheels at the beginning of q
#  indices: [0, 1, 2, 3, 4, 5]
  nodes: all

# todo: wrong, as the order COUNTS. If I add the contacts after the joint regularization, they wont get considered.
velocity_regularization:
  type: Regularization
  variable_name: v
  nodes: all
  weight: *w_vel

acceleration_regularization:
  type: Regularization
  variable_name: a
  nodes: all
  weight: *w_acc

