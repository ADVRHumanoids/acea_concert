# CartesIO stack for the CONCERT welding robot controller.
# Controls the torch end-effector (chain F) + postural regularization only.
# Does NOT require libcentauro_cartesio_addon.so.

solver_options:
  regularization: 1e-4
  back_end: "qpoases"

stack:
  - [ee_F]
  - [postural]

constraints:
  - joint_limits
  - velocity_limits

ee_F:
  type: Cartesian
  name: ee_F
  distal_link: ee_F
  base_link: world
  lambda: 0.1

postural:
  type: Postural
  lambda: 0.01

joint_limits:
  type: JointLimits

velocity_limits:
  type: VelocityLimits
