/**:
  ros__parameters:
    # Simulation v8-complete preset. Also color-agnostic: the sim pipe may be
    # grey and textureless, so do not rely on warm/orange pixels. Keep cylinder
    # validation required; only loosen metric thresholds that are sensitive to
    # idealized Gazebo depth/rasterization.
    pipe_color_prior_enabled: false
    pipe_component_require_valid_cylinder: true
    junction_require_cylinder_mask: true
    pipe_lock_require_fit_model: true
    pipe_coloroff_cylinder_guard_enabled: true

    # Sim depth is clean but the rendered/visible arc can be smaller than the
    # real handheld bag; allow the cylinder candidate to be accepted with fewer
    # sampled inliers while preserving the cylinder model requirement.
    cylinder_component_min_inliers: 120
    cylinder_component_min_inlier_fraction: 0.12
    pipe_tracking_component_min_inliers: 80
    pipe_tracking_component_min_inlier_fraction: 0.08

    publish_pipe_debug_masks: true
    visual_pipe_mask_topic: /acea/pipe_junction/debug/visual_pipe_mask
    cylinder_inlier_mask_topic: /acea/pipe_junction/debug/cylinder_inlier_mask
    rejected_outliers_mask_topic: /acea/pipe_junction/debug/rejected_outliers_mask

    enable_pipe_base_link_lock: true
    pipe_base_lock_target_frame: base_link
    pipe_base_lock_min_track_frames: 8
    pipe_base_lock_correction_gain: 0.08
    pipe_base_lock_use_as_prediction: true
