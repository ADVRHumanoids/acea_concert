services:
  dev:
    build:
      context: .
    image: acea_concert:latest
    stdin_open: true
    tty: true 
    privileged: true
    entrypoint: /bin/bash
    restart: always
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw  # x11
      - ~/.ssh:/home/user/.ssh  # ssh
      - ~/Qt:/home/user/Qt  # qt
      - ../concert_weld:/home/user/concert_ws/src/concert_weld:rw  # mount whole concert_weld folder
      - ./mount_files/config_file.yaml:/patch/config_file.yaml:ro  # config file
      - ./mount_files/concert_prismatic.py:/patch/concert_prismatic.py:ro  # prismatic script
      - ./patch_container.sh:/patch/patch_container.sh:ro


    environment:
      - TERM=xterm-256color
      - DISPLAY
      - NVIDIA_DRIVER_CAPABILITIES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
