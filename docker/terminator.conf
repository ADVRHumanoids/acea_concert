[global_config]
  suppress_multiple_term_dialog = True
[keybindings]
[profiles]
  [[default]]
    background_color = "#111827"
    foreground_color = "#f8fafc"
    scrollback_infinite = True
    bold_is_bright = True
  [[optional]]
    background_color = "#2b2118"
    foreground_color = "#fef3c7"
    scrollback_infinite = True
    bold_is_bright = True
[layouts]
  [[default]]
    [[[window0]]]
      type = Window
      parent = ""
    [[[child1]]]
      type = Terminal
      parent = window0
  [[concert]]
    [[[window]]]
      type = Window
      parent = ""
    [[[tabs]]]
      type = Notebook
      parent = window
      order = 0
      active_page = 0
      labels = Simulation, CONCERT Stack, Weld Optimization
    [[[simulation]]]
      type = Terminal
      parent = simulation_launches
      order = 0
      title = Simulation
      directory = /home/user/concert_ws
      command = CONCERT_ENV_QUIET=1 CONCERT_READY_COMMAND=concert_sim bash --rcfile /home/user/concert_ws/src/acea_concert/scripts/concert_env.bash -i
    [[[simulation_perception]]]
      type = Terminal
      parent = simulation_launches
      order = 1
      title = Perception Simulation
      directory = /home/user/concert_ws
      command = CONCERT_ENV_QUIET=1 CONCERT_READY_COMMAND=concert_sim_perception bash --rcfile /home/user/concert_ws/src/acea_concert/scripts/concert_env.bash -i
    [[[simulation_launches]]]
      type = VPaned
      parent = simulation_tab
      order = 0
      ratio = 0.5
    [[[simulation_tab]]]
      type = HPaned
      parent = tabs
      order = 0
      ratio = 0.7
    [[[xbot_gui]]]
      type = Terminal
      parent = simulation_tab
      order = 1
      title = XBot GUI
      directory = /home/user/concert_ws
      command = CONCERT_ENV_QUIET=1 CONCERT_READY_COMMAND=concert_xbot_gui bash --rcfile /home/user/concert_ws/src/acea_concert/scripts/concert_env.bash -i
    [[[right]]]
      type = HPaned
      parent = tabs
      order = 1
      ratio = 0.82
    [[[main]]]
      type = HPaned
      parent = right
      order = 0
      ratio = 0.72
    [[[controller]]]
      type = Terminal
      parent = main
      order = 0
      title = Controller
      directory = /home/user/concert_ws
      command = CONCERT_ENV_QUIET=1 CONCERT_READY_COMMAND=concert_controller bash --rcfile /home/user/concert_ws/src/acea_concert/scripts/concert_env.bash -i
    [[[background_tasks]]]
      type = VPaned
      parent = main
      order = 1
      ratio = 0.5
    [[[gravity]]]
      type = Terminal
      parent = background_tasks
      order = 0
      title = Gravity
      directory = /home/user/concert_ws
      command = CONCERT_ENV_QUIET=1 CONCERT_READY_COMMAND=concert_gravity bash --rcfile /home/user/concert_ws/src/acea_concert/scripts/concert_env.bash -i
    [[[homing]]]
      type = Terminal
      parent = background_tasks
      order = 1
      title = Homing Execution
      directory = /home/user/concert_ws
      command = CONCERT_ENV_QUIET=1 CONCERT_READY_COMMAND=concert_home bash --rcfile /home/user/concert_ws/src/acea_concert/scripts/concert_env.bash -i
    [[[auxiliary]]]
      type = VPaned
      parent = right
      order = 1
      ratio = 0.5
    [[[gap_pose_perception]]]
      type = Terminal
      parent = auxiliary
      order = 0
      title = Gap Perception
      directory = /home/user/concert_ws
      command = CONCERT_ENV_QUIET=1 CONCERT_READY_COMMAND=concert_gap_perception bash --rcfile /home/user/concert_ws/src/acea_concert/scripts/concert_env.bash -i
    [[[auxiliary_bottom]]]
      type = VPaned
      parent = auxiliary
      order = 1
      ratio = 0.45
    [[[drive]]]
      type = Terminal
      parent = auxiliary_bottom
      order = 0
      title = Drive
      directory = /home/user/concert_ws
      command = CONCERT_ENV_QUIET=1 CONCERT_READY_COMMAND=concert_drive bash --rcfile /home/user/concert_ws/src/acea_concert/scripts/concert_env.bash -i
    [[[optional_tools]]]
      type = VPaned
      parent = auxiliary_bottom
      order = 1
      ratio = 0.55
    [[[homing_optimization]]]
      type = Terminal
      parent = optional_tools
      order = 0
      profile = optional
      title = Homing Optimization (optional)
      directory = /home/user/concert_ws
      command = CONCERT_ENV_QUIET=1 CONCERT_READY_COMMAND=concert_optimize_homing bash --rcfile /home/user/concert_ws/src/acea_concert/scripts/concert_env.bash -i
    [[[gap_tools]]]
      type = VPaned
      parent = optional_tools
      order = 1
      ratio = 0.5
    [[[gap_pose_ground_truth]]]
      type = Terminal
      parent = gap_tools
      order = 0
      profile = optional
      title = Gap Ground Truth (optional)
      directory = /home/user/concert_ws
      command = CONCERT_ENV_QUIET=1 CONCERT_READY_COMMAND=concert_gap bash --rcfile /home/user/concert_ws/src/acea_concert/scripts/concert_env.bash -i
    [[[gap_pose_frequency]]]
      type = Terminal
      parent = gap_tools
      order = 1
      title = Gap Pose Frequency
      directory = /home/user/concert_ws
      command = CONCERT_ENV_QUIET=1 CONCERT_READY_COMMAND=concert_gap_hz bash --rcfile /home/user/concert_ws/src/acea_concert/scripts/concert_env.bash -i
    [[[weld_optimization]]]
      type = Terminal
      parent = weld_optimization_tab
      order = 0
      title = Weld Optimization
      directory = /home/user/concert_ws
      command = CONCERT_ENV_QUIET=1 CONCERT_READY_COMMAND=concert_optimize_weld bash --rcfile /home/user/concert_ws/src/acea_concert/scripts/concert_env.bash -i
    [[[weld_optimization_tab]]]
      type = HPaned
      parent = tabs
      order = 2
      ratio = 0.7
    [[[weld_rviz]]]
      type = Terminal
      parent = weld_optimization_tab
      order = 1
      title = Weld Optimization RViz
      directory = /home/user/concert_ws
      command = CONCERT_ENV_QUIET=1 CONCERT_READY_COMMAND=concert_weld_rviz bash --rcfile /home/user/concert_ws/src/acea_concert/scripts/concert_env.bash -i
[plugins]
